<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control Triciclo Familiar</title>
  <!-- PWA meta tags -->
  <meta name="theme-color" content="#0f172a">
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // === CONFIGURACIÓN DE SUPABASE ===
    const SUPABASE_URL = "https://mqmfnlwfmsnnzykbedpx.supabase.co/rest/v1/"; 
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1xbWZubHdmbXNubnp5a2JlZHB4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM1MDE0OTYsImV4cCI6MjEwOTA3NzQ5Nn0.Y8bJ0ZWJv744L_9nsMzANtFoz1ihC3UQuMM1DH4QzfE";

    const DENOMINACIONES = [2000, 1000, 500, 200, 100, 50, 20, 10, 5];

    const USUARIOS = [
      { id: 'chofer', nombre: 'Chofer (Juan)', rol: 'chofer', pin: '' },
      { id: 'prop1', nombre: 'Propietario 1 (Carlos)', rol: 'propietario', pin: '1234' },
      { id: 'prop2', nombre: 'Propietario 2 (Maria)', rol: 'propietario', pin: '5678' },
      { id: 'admin', nombre: 'Administrador (General)', rol: 'admin', pin: '0000' },
    ];

    function App() {
      const [usuarioActual, setUsuarioActual] = useState(null);
      const [usuarioSeleccionando, setUsuarioSeleccionando] = useState(null);
      const [pinIngresado, setPinIngresado] = useState('');
      const [errorPin, setErrorPin] = useState(false);

      const [vista, setVista] = useState('recaudacion');
      const [fecha, setFecha] = useState(new Date().toISOString().split('T')[0]);
      
      const [billetes, setBilletes] = useState(
        DENOMINACIONES.reduce((acc, den) => ({ ...acc, [den]: 0 }), {})
      );
      const [porcentajeChofer, setPorcentajeChofer] = useState(50);
      const [guardando, setGuardando] = useState(false);
      const [mensajeExito, setMensajeExito] = useState('');

      const [gastos, setGastos] = useState([]);
      const [nuevoGasto, setNuevoGasto] = useState({ concepto: '', monto: '', categoria: 'Mantenimiento' });
      const [jornadas, setJornadas] = useState([]);

      // Cargar datos desde Supabase al iniciar sesión
      useEffect(() => {
        if (usuarioActual && SUPABASE_URL !== "TU_SUPABASE_URL_AQUI") {
          cargarDatosSupabase();
        }
      }, [usuarioActual]);

      const cargarDatosSupabase = async () => {
        try {
          const resJornadas = await fetch(`${SUPABASE_URL}/rest/v1/jornadas?select=*&order=creado_en.desc`, {
            headers: {
              'apikey': SUPABASE_ANON_KEY,
              'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
            }
          });
          if (resJornadas.ok) {
            const dataJ = await resJornadas.json();
            setJornadas(dataJ);
          }

          const resGastos = await fetch(`${SUPABASE_URL}/rest/v1/gastos?select=*&order=creado_en.desc`, {
            headers: {
              'apikey': SUPABASE_ANON_KEY,
              'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
            }
          });
          if (resGastos.ok) {
            const dataG = await resGastos.json();
            setGastos(dataG);
          }
        } catch (e) {
          console.error("Error cargando de Supabase:", e);
        }
      };

      const totalRecaudado = Object.entries(billetes).reduce(
        (sum, [den, cant]) => sum + (Number(den) * (Number(cant) || 0)), 0
      );
      const pagoChofer = (totalRecaudado * porcentajeChofer) / 100;
      const pagoPropietarios = totalRecaudado - pagoChofer;

      const handleCantidadChange = (den, cant) => {
        const valor = Math.max(0, parseInt(cant) || 0);
        setBilletes(prev => ({ ...prev, [den]: valor }));
      };

      const guardarJornada = async () => {
        if (totalRecaudado === 0) {
          alert("Por favor ingresa al menos un billete.");
          return;
        }

        setGuardando(true);
        const datosJornada = {
          fecha,
          total_recaudado: totalRecaudado,
          porcentaje_chofer: porcentajeChofer,
          pago_chofer: pagoChofer,
          pago_propietarios: pagoPropietarios,
          registrado_por: usuarioActual.nombre,
          desglose_billetes: JSON.stringify(billetes),
          creado_en: new Date().toISOString()
        };

        try {
          if (SUPABASE_URL !== "TU_SUPABASE_URL_AQUI") {
            const res = await fetch(`${SUPABASE_URL}/rest/v1/jornadas`, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'apikey': SUPABASE_ANON_KEY,
                'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                'Prefer': 'return=representation'
              },
              body: JSON.stringify(datosJornada)
            });
            if (res.ok) {
              const dataGuardada = await res.json();
              setJornadas(prev => [dataGuardada[0] || datosJornada, ...prev]);
            }
          } else {
            setJornadas(prev => [datosJornada, ...prev]);
          }

          // LIMPIAR FORMULARIO TRAS GUARDAR CON ÉXITO
          setBilletes(DENOMINACIONES.reduce((acc, den) => ({ ...acc, [den]: 0 }), {}));
          setMensajeExito('¡Jornada registrada y pantalla reiniciada!');
          setTimeout(() => setMensajeExito(''), 3500);
        } catch (e) {
          console.error(e);
          alert("Error al guardar en la base de datos.");
        } finally {
          setGuardando(false);
        }
      };

      const agregarGasto = async (e) => {
        e.preventDefault();
        if (!nuevoGasto.concepto || !nuevoGasto.monto) return;

        const gastoObj = {
          fecha,
          concepto: nuevoGasto.concepto,
          monto: Number(nuevoGasto.monto),
          categoria: nuevoGasto.categoria,
          registrado_por: usuarioActual.nombre,
          creado_en: new Date().toISOString()
        };

        try {
          if (SUPABASE_URL !== "TU_SUPABASE_URL_AQUI") {
            const res = await fetch(`${SUPABASE_URL}/rest/v1/gastos`, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'apikey': SUPABASE_ANON_KEY,
                'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                'Prefer': 'return=representation'
              },
              body: JSON.stringify(gastoObj)
            });
            if (res.ok) {
              const dataG = await res.json();
              setGastos(prev => [dataG[0] || gastoObj, ...prev]);
            }
          } else {
            setGastos(prev => [gastoObj, ...prev]);
          }
          setNuevoGasto({ concepto: '', monto: '', categoria: 'Mantenimiento' });
        } catch (e) {
          console.error(e);
        }
      };

      const eliminarJornada = async (id, indexLocal) => {
        if (!confirm("¿Estás seguro de eliminar este registro?")) return;
        try {
          if (id && SUPABASE_URL !== "TU_SUPABASE_URL_AQUI") {
            await fetch(`${SUPABASE_URL}/rest/v1/jornadas?id=eq.${id}`, {
              method: 'DELETE',
              headers: {
                'apikey': SUPABASE_ANON_KEY,
                'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
              }
            });
          }
          setJornadas(prev => prev.filter((_, idx) => idx !== indexLocal));
        } catch (e) {
          console.error(e);
          alert("No se pudo eliminar el registro.");
        }
      };

      const verificarPin = (e) => {
        e.preventDefault();
        if (pinIngresado === usuarioSeleccionando.pin) {
          setUsuarioActual(usuarioSeleccionando);
          setUsuarioSeleccionando(null);
          setPinIngresado('');
          setErrorPin(false);
          setVista('recaudacion');
        } else {
          setErrorPin(true);
          setPinIngresado('');
        }
      };

      // PANTALLA DE ACCESO
      if (!usuarioActual) {
        return (
          <div className="min-h-screen bg-slate-950 text-slate-100 flex items-center justify-center p-4">
            <div className="bg-slate-900 border border-slate-800 p-6 rounded-2xl max-w-sm w-full space-y-4 shadow-xl">
              <div className="text-center space-y-1">
                <span className="text-3xl">🛺</span>
                <h1 className="text-lg font-bold text-amber-400">Triciclo Familiar</h1>
                <p className="text-xs text-slate-400">Selecciona tu perfil de acceso</p>
              </div>

              {usuarioSeleccionando ? (
                <form onSubmit={verificarPin} className="space-y-3 pt-2">
                  <div className="text-xs text-amber-400 font-semibold text-center">
                    Ingresa el PIN para {usuarioSeleccionando.nombre}
                  </div>
                  <input 
                    type="password"
                    maxLength="4"
                    placeholder="••••"
                    autoFocus
                    value={pinIngresado}
                    onChange={(e) => setPinIngresado(e.target.value)}
                    className="w-full bg-slate-950 border border-slate-700 text-center tracking-widest text-lg text-white rounded-xl py-2 focus:outline-none focus:border-amber-500"
                  />
                  {errorPin && <p className="text-[10px] text-rose-400 text-center">PIN incorrecto. Intenta de nuevo.</p>}
                  
                  <div className="flex gap-2 pt-1">
                    <button 
                      type="button" 
                      onClick={() => { setUsuarioSeleccionando(null); setPinIngresado(''); setErrorPin(false); }}
                      className="flex-1 py-2 bg-slate-800 hover:bg-slate-700 text-xs font-bold rounded-xl text-slate-300"
                    >
                      Atrás
                    </button>
                    <button 
                      type="submit" 
                      className="flex-1 py-2 bg-amber-500 hover:bg-amber-400 text-xs font-bold text-slate-950 rounded-xl"
                    >
                      Entrar
                    </button>
                  </div>
                </form>
              ) : (
                <div className="space-y-2 pt-2">
                  {USUARIOS.map(user => (
                    <button
                      key={user.id}
                      onClick={() => {
                        if (user.pin === '') {
                          setUsuarioActual(user);
                          setVista('recaudacion');
                        } else {
                          setUsuarioSeleccionando(user);
                        }
                      }}
                      className="w-full py-3 px-4 bg-slate-800 hover:bg-amber-500 hover:text-slate-950 font-semibold text-xs rounded-xl border border-slate-700 transition-all flex justify-between items-center text-left group"
                    >
                      <span>{user.nombre}</span>
                      <span className="text-[10px] opacity-60 uppercase bg-slate-950 group-hover:bg-amber-600 group-hover:text-white px-2 py-0.5 rounded">
                        {user.pin ? '🔒 Protegido' : 'Libre'}
                      </span>
                    </button>
                  ))}
                </div>
              )}
            </div>
          </div>
        );
      }

      // Cálculos para el resumen del chofer
      const hoyStr = new Date().toISOString().split('T')[0];
      const mesActualStr = hoyStr.slice(0, 7); // YYYY-MM
      const anioActualStr = hoyStr.slice(0, 4); // YYYY

      const jornadasChofer = jornadas.filter(j => usuario
